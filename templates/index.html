<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2c3e50; }
        p { color: #555; }
        input[type="file"] { border: 2px dashed #007bff; padding: 20px; border-radius: 5px; cursor: pointer; display: block; width: 90%; margin: 20px auto; }
        input[type="submit"] { background-color: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        input[type="submit"]:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NLP Resume Analyzer</h1>
        <p>Upload your resume (PDF or DOCX) to get a detailed analysis of its content, skills, and readability.</p>
        <form action="/" method="post" enctype="multipart/form-data">
            <input type="file" name="resume" required>
            <input type="submit" value="Analyze My Resume">
        </form>
    </div>
</body>
</html>
